p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">老城区是河内历史上的商业核心：以行业命名的窄街密集交错（银街 Hàng Bạc、纸街 Hàng Mã、丝绸街 Hàng Đào），环绕 12 公顷的还剑湖。湖中小岛上的玉山祠由红色的栖旭桥连接，周末傍晚湖边封路成为步行区。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-west-lake-tay-ho"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">西湖（西湖郡）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">4 hotels · <!-- -->5 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">湖畔咖啡馆与日落餐饮 · 精品与设计住宿</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">西湖是河内最大的淡水湖，约 500 公顷、岸线 17 公里，四周是花园、别墅与湖畔咖啡馆，并由青年路与较小的竹帛湖相隔。东南岸小岛上是河内最古老的佛寺镇国寺。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-cau-giay-district"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">纸桥郡（Cầu Giấy）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">写字楼 · 大学城</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">纸桥郡位于巴亭以西，是河内的大学与办公区：越南国家大学片区、Indochina Plaza，以及 72 层的 Keangnam Landmark 72 大厦（河内洲际 Landmark72 酒店所在）。这里实用而非风景化——玻璃写字楼、学生食堂、密集的韩餐与日料街，东北边缘则是越南民族学博物馆。Nhổn–河内地铁线穿过本区。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-nam-tu-liem-district"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">南慈廉郡与美亭</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">新城区 · 体育场</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">南慈廉是环城路以西规划出的新城：美亭国家体育场、国家会议中心、JW 万豪与河内西喜来登，以及升龙大道上的新越南军事历史博物馆。一切都现代、开阔、适合车行，但几乎所有地方都无法步行互达。它适合会展、商务和大型酒店住宿，不适合第一次来河内观光。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-hai-ba-trung-vincom"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">二征夫人郡与 Vincom 一带</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">购物中心与本地日常 · 长住与实惠住宿</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">二征夫人郡在还剑郡东南，是密集的居住与商业区，对游客最知名的是赵婆街上的 Vincom Center 购物中心，以及本地市场和社区小馆。这里是城市的工作区而非旅游区，价格比老城区低，食物也更本地。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-hoan-kiem-south-hang-bai"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">还剑南区（行排 · 观使）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">湖与火车站之间</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">还剑郡的南半部，从湖边沿行排街、李常杰街一路到陈兴道街与火车站。这里是市中心最实用的一半：火炉监狱纪念馆、越南妇女博物馆、行排街与庄钱街的商业面，以及全城很大一部分四星酒店。步行十分钟即到湖边，而老城区的喧闹留在湖的另一侧。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-dong-da-district"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">栋多郡（Đống Đa）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">学生城 · 本地小吃</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">栋多郡在文庙以西、巴亭以南，沿西山—阮良朋一线展开。这里有 1789 年西山之战阵亡者的栋多丘，也有围绕郎寺、制帛、社坛形成的咖啡馆街区，是河内学生的日常食堂。文庙与升龙皇城往北只需几分钟车程，但本区以居民生活为主，喧闹而少有标志性景点。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-long-bien-gia-lam"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">龙编郡与嘉林县（红河东岸）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">0 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">红河 · 江东慢生活</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">红河东岸在气质上是另一座城市：龙编郡与嘉林县，经 1902 年的长边桥或较新的章阳桥、永绥桥抵达。龙编有桥下的批发市场和河中的冲积“香蕉岛”；嘉林则有通往钵场的老路和嘉林火车站。这里的房间比还剑郡更大更便宜，代价是过桥——早上八点或傍晚五点半过桥的时间，往往远超地图上的估计。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-thanh-xuan-district"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">青春郡（Thanh Xuân）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">0 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">公寓楼 · 本地生活</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">青春郡沿阮廌大道与屈维进街向西南展开，中部是
