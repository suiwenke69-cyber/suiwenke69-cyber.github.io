">塔仔山 · 老城</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">塔仔山是金边的起点——14 世纪奔夫人从湄公河捞起四尊铜佛的传说就发生在这里。山下的街区就是老法式城区：殖民时期的中央邮政局、92 至 130 街的骑楼、国家图书馆、中央市场（新街市），以及双威等老牌酒店。夜里比河畔安静，步行到河边只要 15 至 20 分钟，是同时靠近塔仔山与河岸的住宿区。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-sen-sok-por-sen-chey"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">俄罗斯大道与森速片区</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">商务 · 机场路</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">这是沿俄罗斯大道（4 号国道）向西的走廊：从市区的 Chip Mong Tower 往外，经过森速区的封闭式住宅区和永旺梦乐城2，一直到普森芷区——金边经济特区所在的工业带和波成东旧机场所在地。旅客来这里主要是为了带停车位、公路交通方便的商务酒店、长住公寓和大型商场，而不是观光；进市区视堵车情况约 20 至 40 分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-bkk1-chamkarmon"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">BKK1 · 占卡蒙区</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">4 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">长住与公寓 · 早午餐、咖啡和各国餐饮</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">BKK1 和更大的占卡蒙区在市中心以南，是金边的外籍居民生活区，咖啡馆、面包店、各国餐厅和 51 街酒吧带密集成网。同区还有俄罗斯市场（Phsar Tuol Tom Pong），卖工厂尾单服装和街头小吃，以及吐斯廉屠杀博物馆（S-21），日常居住和城市最重要的历史景点可以放在一起。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-tonle-bassac-koh-pich"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">钻石岛与巴萨河畔</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">赌场 · 新城</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">巴萨河分区与人工岛钻石岛（Koh Pich）是金边变化最快的东南角：金界娱乐城、永旺梦乐城1、索菲特酒店和一排排新公寓塔楼，通过钻石岛大桥与市区相连。岛上的滨水步道、会展中心和夜间灯光吸引本地家庭周末前来，到河畔和王宫约十分钟车程。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-olympic-veal-vong"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">奥林匹克体育场一带（玛卡拉区）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">体育场 · 本地生活</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">威旺分区和奥林匹克体育场周边构成了玛卡拉区——夹在莫尼旺大道与都昆区之间的小片区。体育场是为 1963 年东南亚半岛运动会而建的高棉现代主义地标，清晨和傍晚跑道、看台与前广场上满是散步和跳健身操的人。周边是菜市场、中档酒店、健身房和便宜的粿条铺，是再日常不过的金边生活，到 BKK1 只要十分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-toul-kork"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">堆谷区</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">本地社区感与柬埔寨日常 · 便宜的市场和街头小吃</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">堆谷区在市中心西北，以本地居民为主，核心是 Phsar Toul Kork 市场和 TK Avenue 一带的商铺，永旺 2 店在不远的森速区。这里几乎没有招牌景点，但吃的更便宜也更本地，生活气息真实，坐嘟嘟车到河滨约 15 至 25 分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-boeng-keng-kang-bkk2-bkk3"><button type="button" class="block w-ful
