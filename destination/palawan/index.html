-ink-soft">菲律宾西南的长条岛，普林塞萨港是门户。地下河和爱妮岛的泻湖是主要理由，交通需要多留时间。</p><button type="button" class="btn-secondary btn-xs mt-3">看整座岛</button></header><div class="border-t border-line px-4 py-3"><div class="flex items-center justify-between gap-3"><h3 class="text-[15px] font-semibold tracking-[-0.01em]">住哪里</h3><div role="radiogroup" aria-label="区域范围" class="inline-flex rounded-lg border border-line bg-paper p-0.5"><button type="button" role="radio" aria-checked="true" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs bg-surface text-ink shadow-[0_1px_2px_rgba(20,22,26,0.08)]">住宿区<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-accent-soft text-accent">9</span></button><button type="button" role="radio" aria-checked="false" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs text-muted hover:text-ink">一日游<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-black/[0.06] text-muted">2</span></button></div></div><p class="mt-1.5 text-[12px] leading-relaxed text-muted">这些是旅行者真正会选的落脚区域。选一个，地图会跟着走。</p></div><div class="space-y-3 px-3 pb-4"><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-ppc-city-centre"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">普林塞萨港市中心</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">9 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">第一晚／最后一晚 · 地下河和本田湾一日游基地</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">普林塞萨港是巴拉望省首府和主要交通枢纽，国际机场离 Rizal 大道一带的市中心约 2 公里。去 Sabang 的普林塞萨港地下河国家公园（西北约 80 公里、2 小时）和本田湾跳岛都以这里为基地，滨海步道、公共市场和海鲜餐厅是多数巴拉望行程的起点和终点。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-el-nido-town"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">爱妮岛镇</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">8 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">巴奎特湾 A 至 D 跳岛线 · 大潟湖和石灰岩喀斯特</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">爱妮岛镇是巴拉望北部的商业中心，也是通往巴奎特湾的门户，湾内的石灰岩岛屿和潟湖构成经典的 A 至 D 四条跳岛线路。镇上的海滩一般，但 Buena Suerte 和 Corong-Corong 一带的海滨街上全是潜水店、餐厅、酒吧和酒店。到达方式要么坐螺旋桨飞机到以北约 4 公里的 1,000 米 Lio 跑道，要么从普林塞萨港坐 5 至 6 小时面包车／大巴（约 175 公里）。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-sabang"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">Sabang (Puerto Princesa Subterranean River area)</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">地下河入口 · 世界遗产自然景观</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">Sabang 是西海岸的一个小村，是普林塞萨港地下河国家公园的登船点，该公园是世界遗产，也是“世界新七大自然奇观”之一。从普林塞萨港开车或坐面包车约 2 小时，再从 Sabang 码头坐螃蟹船绕过海岬到洞口，参加有向导的地下河划船。村里有几家客栈和餐馆，海滩好看但浪有时很大。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-las-cabanas"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">Las Cabañas &amp; Marimegmeg</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">海滩俱乐部 · 滑索</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">拉斯卡巴纳斯（也叫马里梅格梅格）是爱妮岛镇以南约 4 公里岬角上的海滩带，沿北公主港公路坐三轮车可达。在爱妮岛一带，它把可游泳的海岸、朝西的日落和一群海滩酒吧结合得最好，750 米滑索也从这里跨海飞向德佩尔德特岛。此处度假村比镇上安静、价位通常更高；沿线没有人行道，晚上出入要靠三轮车。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-corong-corong"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">Corong-Corong</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">日落海岸 · 海边餐厅</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">科隆科隆在爱妮岛镇西南侧，与出发跳岛的镇海滩隔着一个岬角。它正对西面，因此能看到镇海滩看不到的日落；岸线上一排小酒吧、烧烤店与家庭式旅馆，而不是潜水店。步行 15–25 分钟或坐一小段三轮车就到镇中心，比镇里安静，餐厅、市场与行程代理仍在可及范围内。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-nacpan-beach"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">纳克潘海滩</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">开阔长滩散步 · 日落摄影</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">纳克潘海滩在爱妮岛镇以北约 45 至 60 分钟车程的 Barangay Bucana，是一段约 4 公里的沙滩，通常和翻过头角就到的 Calitang（双滩）一起玩。被普遍评为爱妮岛一带最好的海滩，空间大、水清、日落好，沙滩后面只有简易棚屋、基本厕所和几家野奢营地。进入要走没铺装的土路，坐摩托车、三轮车或拼面包车，附近没有 ATM。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-port-barton"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">巴顿港</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">渔村海滩 · 海龟浮潜</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">巴顿港是圣维森特市镇里的一个渔村，从公主港走山路约 3 到 3.5 小时面包车。多年来它一直是爱妮岛的替代选择：想要同样的海水，却不想要镇上的喧嚣。海滩就是主街——民宿、潜水店和几家餐厅直接建在沙上；标准出海线路去德国岛、异域岛以及湾内的海龟与珊瑚浮潜点。记得带现金（村里没有 ATM），电力和网络也比东海岸更不稳定。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" dat
