ccent">城市酒店、公寓和酒店式公寓 · 夜生活、酒吧和现场音乐</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">这里是宿务市的现代上城区，核心是 Cebu IT Park——建在旧 Lahug 机场地块上的规划商务生活区——并向 Lahug、Ayala Center Cebu 和 General Maxilom 大道（“芒果大道”）夜生活带延伸。宿务最宜步行、空调最足、最有国际感的一片，有 Sugbo Mercado 夜市小吃、几十家咖啡馆，也是全岛出租车和 Grab 最好叫的地方。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-mactan-island-lapu-lapu"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">麦克坦岛 · 拉普拉普（度假村与机场）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">海滩度假村和高档酒店 · 机场便利与过境住宿</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">麦克坦岛上有宿务的国际机场和大部分高档海滩度假村，分布在 Punta Engaño、Maribago 和麦克坦沿海。1521 年麦克坦海战也发生在这里，岛东岸的麦克坦神社（拉普拉普神社）就是纪念地。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-moalboal-south-cebu"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">墨宝 · 宿务南部</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">5 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">浮潜、自由潜和水肺潜水 · 沙丁鱼风暴与海龟</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">墨宝的 Panagsama 海滩外面就是岸礁，几百万条沙丁鱼常驻岸边，可以直接从沙滩下水浮潜；再往南约 45 分钟是 Badian 的卡瓦山瀑布，菲律宾最有名的溯溪线路。更远的南海岸还有奥斯洛布鲸鲨和 Tumalog 瀑布，但整个区域离宿务市 2.5 至 4 小时车程，所以本身就是一个目的地，不是一日游基地。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-cebu-business-park-ayala"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">宿务商务园区与阿亚拉（商务区）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">商务 · 购物 · 城市酒店</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">宿务商务园区是这座城市规划最完整的商业区：写字楼、银行、公寓楼与阿亚拉中心宿务购物中心围绕中央绿地排布，位于Luz与Hipodromo一带，介于上城拉胡格与港区之间，距宿务IT Park约1.5公里，是全岛最适合步行办事的地段。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-talisay-south-coastal-road"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">塔利萨伊与南部沿海公路</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">南线公路 · 烤乳猪小镇 · 一日游</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">塔利萨伊是宿务市以南沿纳塔利奥·巴卡尔索沿海公路的第一座城市，这条经塔利萨伊、明拉尼利亚、纳加、圣费尔南多、卡尔卡尔直到西邦加的公路，是所有南线行程的必经走廊。卡尔卡尔是全省的烤乳猪与古迹之乡，西邦加有西马拉圣母朝圣地，而这条沿海公路是通往奥斯洛布、巴迪安与莫阿尔博阿尔的唯一路线。塔利萨伊本身是港口与住宅城市，并非度假地。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-guadalupe-banawa"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">瓜达卢佩与巴纳瓦（宿务市西南）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">0 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">本地生活 · 长住 · 山坡</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">瓜达卢佩与巴纳瓦构成宿务市西南的住宅区，从瓜达卢佩河一路爬升到巴纳瓦丘陵。这里几乎没有为游客而建的设施——居民在此生活、在社区市场买菜、通勤前往商务区——但它是距历史城区最近的普通生活街区，也是上山前往山脊观景路的常见起点。</p></div></button></article></div><footer class="border-t border-line px-4 py-3"><p class="text-[11.5px] leading-relaxed text-muted">本行程助手收录了 9 个区
