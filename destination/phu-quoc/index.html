">住哪里</h3><div role="radiogroup" aria-label="区域范围" class="inline-flex rounded-lg border border-line bg-paper p-0.5"><button type="button" role="radio" aria-checked="true" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs bg-surface text-ink shadow-[0_1px_2px_rgba(20,22,26,0.08)]">住宿区<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-accent-soft text-accent">6</span></button><button type="button" role="radio" aria-checked="false" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs text-muted hover:text-ink">一日游<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-black/[0.06] text-muted">7</span></button></div></div><p class="mt-1.5 text-[12px] leading-relaxed text-muted">这些是旅行者真正会选的落脚区域。选一个，地图会跟着走。</p></div><div class="space-y-3 px-3 pb-4"><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-an-thoi-south"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/phu-quoc/area-an-thoi-south-0.jpg" alt="fisherman&#x27;s ville at An Thoi, Phu Quoc, VietNam" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Tonbi ko · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">安泰与南部海滩（肯沙滩、白沙滩、日落小镇）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->7 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">全岛最好的白沙滩（白沙滩、肯沙滩）· 跳岛、浮潜与香岛缆车</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">富国岛南部以安泰镇为中心，拥有全岛最出名的沙：细白新月形的白沙滩（Bãi Sao），以及富国岛翡翠湾JW万豪所在的肯沙滩（Bãi Khem）。安泰也是前往安泰群岛与创纪录香岛缆车的出发点，太阳集团在此建了意大利风情的日落小镇，有接吻桥、Vui-Fest 夜市和每晚演出。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-ong-lang-cua-can-ganh-dau"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">翁朗、弓干与甘道（西北海岸）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->7 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">清静少人的海滩 · 国家公园森林、胡椒园与渔村</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">西北这一大片包括翁朗的悠闲海湾、弓干（Cửa Cạn）河口，以及更北的甘道（Gành Dầu）海滩与海角。这里是岛上的自然与亲子娱乐区：富国国家公园覆盖大部分内陆森林，甘道一带的北部长滩则集中了珍珠乐园、珍珠野生动物园和大世界。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-duong-dong"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/phu-quoc/area-duong-dong-0.jpg" alt="Duong Dong Phu quoc, Kien Giang vietnam" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">trungydang · CC BY 3.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">阳东镇中心</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">8 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">街头小吃与海鲜 · 夜市与伴手礼</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">阳东镇是富国岛的主镇和行政中心，坐落在岛西岸阳东河口，餐厅、咖啡馆、商铺、旅行社和富国岛（舅庙）夜市都集中在这里，是不想依赖摩托车的旅客最方便的据点。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-duong-to"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/phu-quoc/area-duong-to-0.jpg" alt="Biển Phú quốc, Dương Tơ, Vietnam" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">trungydang · CC BY 3.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">阳东与长滩南段</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">度假村 · 机场 · 瀑布</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">阳东（Dương Tơ）乡拥有长滩（Bãi Trường）南段——从富国国际机场一路向南延伸到安泰的西向沙滩。这里是全岛最便利的高端住宿区：机场10–20分钟车程，沙滩正对日落，洲际、丽晶等大型海滨酒店都在这一带，而不是在阳东镇上。内陆的30·4路通往胡椒园、珍珠展厅与陈溪溪流公园。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-vung-bau"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">北部长滩、翁保与西北海岸</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">长滩 · 度假村 · 清静</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">弓干（Cửa Cạn）到甘道（Gành Dầu）之间的西北海岸拥有全岛第二条长滩——当地也叫Long Beach——以及更小的翁保（Vũng Bầu）海湾。沙质好、密度低：Fusion、Nam Nghi、Crowne Plaza Starbay 等中高端度假村之间夹着大片空沙滩，背后是胡椒园与森林边缘。这里是全岛&quot;人均空间&quot;最划算的住宿区，代价是出行必须有车。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-long-beach-bai-truong"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/phu-quoc/area-long-beach-bai-truong-0.jpg" alt="Sunset on the Long Beach in Phu Quoc Island, Vietnam" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Alexey Komarov · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">长滩（Bãi Trường，阳东段）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">日落与沙滩酒吧 · 度假村与海滩俱乐部</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">白长滩（Bãi Trường）就是通称的长滩，从阳东镇向南延伸的西向沙滩，也是富国岛传统的旅游带。面向泰国湾，日落是招牌，沙滩沿线排满海滩酒吧、海鲜餐厅，以及从中端到五星的度假村。它是全岛最易到达的沙滩，距富国国际机场约10–20分钟，从阳东镇多处可步行抵达。</p></div></button></article></div><footer class="border-t border-line px-4 py-3"><p class="text-[11.5px] leading-relaxed text-muted">本行程助手收录了 12 个区域。区域范围是根据已收录内容推算的近似范围，不是官方行政区划。</p></footer></div></div></div></div></div></section></main><!--$--><!--/$--><script src="/_next/static/chunks/webpack-f951ec1a8bd314fd.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[9766,[],\"\"]\n3:I[8924,[],\"\"]\n5:I[4431,[],\"OutletBoundary\"]\n7:I[5278,[],\"AsyncMeta
