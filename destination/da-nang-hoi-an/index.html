px] font-medium leading-tight text-accent">世遗老城漫步 · 灯笼夜景与夜间摄影</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">会安古城是 1999 年列入世界遗产的秋盆河畔贸易港，15 至 19 世纪的面貌保存相当完整，有华人会馆、筒屋、18 世纪日本廊桥，以及密集的裁缝店与灯笼铺。老城大部分时段（尤其傍晚）禁止机动车，经典玩法是傍晚在灯笼下散步，再乘船游秋盆河。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-my-khe-beach"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">美溪海滩与武元甲大道（岘港海滨）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">5 hotels · <!-- -->2 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">海滩与旺季游泳 · 平坦海岸的日出散步与跑步</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">美溪是岘港的主要城市海滩，细沙长滩从韩江口向东南一直延伸到五行山，前面是武元甲大道和沿街密集的酒店、咖啡馆与海鲜餐厅。它是“海滩优先”旅客的默认据点：武元甲大道多数酒店步行五分钟内到沙滩，机场车程约 15 分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-da-nang-han-river-west-bank"><button type="button" cla .7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">农诺·五行山（长征海滩带）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">度假村 · 海滩 · 五行山</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">农诺是岘港海滩的南半段，沿长征路一直延伸到广南省界，差不多是去会安的一半路程。这里的沙与美溪同为一脉细白，但开发密度低得多，因此岘港的重磅海滨度假村——万豪、喜来登大酒店、凯悦——都聚在这一段。向内陆一走便是五行山，以及世代打磨同一种大理石的农诺石雕村。想住度假村、要海滩、又想二十多分钟到会安的旅客，这里是最顺的落脚点。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-son-tra-peninsula"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">山茶半岛（猴山）与灵应寺</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->3 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">自然、林道与观景点 · 灵应寺与观音像</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">山茶是岘港东北 4,439 公顷的森林半岛与自然保护区，最高处为山茶山（常称猴山），栖息着濒危的红腿白臀叶猴。标志景观是灵应寺与 67 米高的观音像，环半岛海岸公路可俯瞰海湾与城市天际线，是岘港最好的观景点。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-an-bang-beach-village"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">安邦海滩村</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">海滩 · 别墅 · 十五分钟到古城</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">安邦位于会安古城东北约四公里的海岸上，阮潘荣路与二征夫人路一路通到沙滩。它已经成为会安的默认海滩据点：沙滩上是一排海滩俱乐部与海鲜馆，身后小巷里则密布小型精品度假村、别墅酒店与民宿。骑车或打车十到十五分钟即达古城，因此在这条走廊上，只有这里能让你同一天上午泡海、傍晚看灯笼。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-cua-dai-beach-strip"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">大门海滩带</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">度假村 · 开阔海滩 · 河口</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">大门是会安古城以东约五公里、秋盆河入海口处的海滩，沿大门路可到。这里曾是会安最早的海滨度假带，如今仍聚集着这段海岸上体量最大的酒店；但多年侵蚀与台风反复冲击，部分沙滩和老旧物业状况不佳，北边的安邦则接过了精品住宿与海滩俱乐部的位置。留在这里的，是古城附近最安静、最开阔的一片海滩，更适合当度假村据点，而不是散步觅食的地方。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-lien-chieu-nguyen-tat-thanh-bay"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">莲沼·阮必成湾</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">本地海湾 · 鱼露 · 海云岭路上</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">岘港西北这道弧线自韩江口起，沿阮必成路经春绍、南翁，一直到海云岭脚下。这是全城最不观光化的一段海岸：仍是作业中的渔湾，有南翁鱼露村、主要做本地人生意的海鲜馆，以及几座面向国内与日本市场的大型度假项目。这一带不适合步行，但公路条件极好，海云岭与陵姑湾就在门口。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-my-an-an-thuong"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><div class="flex h-full w-full flex-col items-center justify-center gap-1.5 px-3 text-center bg-paper-warm" aria-hidden="false"><span class="text-faint/60"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-2h7.6l1 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"></path><path d="m3 3 18 18"></path></svg></span><span class="max-w-[22ch] text-[10.5px] leading-snug text-faint">暂无照片</span></div></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">美安·安上（岘港咖啡与海滩街区）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">0 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">咖啡 · 精品住宿 · 海滩</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">美安坊与其中的安上街区夹在武元甲海滨大道与韩江之间，由安上街、阮文话路及其间的小巷织成一张紧凑路网。这里是岘港最适合步行、最有生活气的一段：几十家咖啡馆与早午餐店、小体量精品酒店与服务式公寓（而非高层大楼），往东约四百米就是沙滩。嫌海滨大型度假村太封闭的旅客，多半会选这里落脚。</p></div></button></article></div><footer class="border-t border-line px-4 py-3"><p class="text-[11.5px] leading-relaxed text-muted">本行程助手收录了 12 个区域。区域范围是根据已收录内容推算的近似范围，不是官方行政区划。</p></footer></div></div></div></div></div></section></main><!--$--><!--/$--><script src="/_next/static/chunks/webpack-f951ec1a8bd314fd.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[9766,[],\"\"]\n3:I[8924,[],\"\"]\n5:I[4431,[],\"OutletBoundary\"]\n7:I[5278,[],\"AsyncMetadataOutlet\"]\n9:I[4431,[],\"ViewportBoundary\"]\nb:I[4431,[],\"MetadataBoundary\"]\nc:\"$Sreact.suspense\"\ne:I[7150,[],\"\"]\n:HL[\"/_next/static/css/f2b36fc23db75d41.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"5ACfA3pAbUiyp1WeoV-oy\",\"p\":\"\",\"c\":[\"\",\"destination\",\"da-nang-hoi-an\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"destination\",{\"children\":[[\"id\",\"da-nang-hoi-an\",\"d\"],{\"children\":[\"__PAGE__\",{}]}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/f2b36fc23db75d41.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"className\":\"min-h-full\",\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateSc
