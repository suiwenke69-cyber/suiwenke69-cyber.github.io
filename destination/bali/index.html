"round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m18 15-6-6-6 6"></path></svg></span></button></div><div class="scroll-area min-h-0 flex-1 border-t border-line"><div class="min-h-0"><div class="flex h-full min-h-0 flex-col"><nav class="shrink-0 border-b border-line px-2 pb-2 pt-2" aria-label="区域范围"><div class="grid grid-cols-4 gap-1"><button type="button" role="tab" aria-selected="true" title="先了解这个岛和它的区域" data-testid="dest-tab-explore" class="relative rounded-lg px-2 py-2 text-[12.5px] font-semibold transition-colors duration-150 bg-accent-soft text-accent">探索</button><button type="button" role="tab" aria-selected="false" title="万豪与希尔顿旗下的酒店" data-testid="dest-tab-stay" class="relative rounded-lg px-2 py-2 text-[12.5px] font-semibold transition-colors duration-150 text-muted hover:bg-black/[0.03] hover:text-ink-soft">住宿</button><button type="button" role="tab" aria-selected="false" title="海滩、自然、文化、美食与夜生活" data-testid="dest-tab-do" class="relative rounded-lg px-2 py-2 text-[12.5px] font-semibold transition-colors duration-150 text-muted hover:bg-black/[0.03] hover:text-ink-soft">游玩</button><button type="button" role="tab" aria-selected="false" title="你的行程，以及每段之间的交通" data-testid="dest-tab-plan" class="relative rounded-lg px-2 py-2 text-[12.5px] font-semibold transition-colors duration-150 text-muted hover:bg-black/[0.03] hover:text-ink-soft">行程</button></div></nav><div class="min-h-0 flex-1"><div class="scroll-area h-full"><header class="px-4 pb-3 pt-4"><p class="label-caps">印度尼西亚</p><h2 class="mt-1 text-[26px] font-semibold leading-none tracking-[-0.02em] text-ink">巴厘岛</h2><p class="mt-2.5 text-[13px] leading-relaxed text-ink-soft">巴厘岛把海滩小镇、冲浪海岸、文化高地和度假区塞进了一座一天就能横穿的岛——所以行程排得好不好，本质上是地理问题。住在哪里，决定了你有多少时间花在路上。</p><button type="button" class="btn-secondary btn-xs mt-3">看整座岛</button></header><div class="border-t border-line px-4 py-3"><div class="flex items-center justify-between gap-3"><h3 class="text-[15px] font-semibold tracking-[-0.01em]">住哪里</h3><div role="radiogroup" aria-label="区域范围" class="inline-flex rounded-lg border border-line bg-paper p-0.5"><button type="button" role="radio" aria-checked="true" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs bg-surface text-ink shadow-[0_1px_2px_rgba(20,22,26,0.08)]">住宿区<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-accent-soft text-accent">9</span></button><button type="button" role="radio" aria-checked="false" class="inline-flex items-center gap-1.5 rounded-[6px] font-medium transition-colors disabled:opacity-40 px-2 py-1 text-2xs text-muted hover:text-ink">一日游<span class="rounded-full px-1.5 py-px text-[10px] font-semibold tabular-nums bg-black/[0.06] text-muted">6</span></button></div></div><p class="mt-1.5 text-[12px] leading-relaxed text-muted">这些是旅行者真正会选的落脚区域。选一个，地图会跟着走。</p></div><div class="space-y-3 px-3 pb-4"><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-seminyak"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-seminyak-0.jpg" alt="Seminyak Beach in Bali." loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Christophe95 · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">水明漾</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">7 hotels · <!-- -->16 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">美食 · 夜生活</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">水明漾是巴厘岛最成熟的度假区，餐厅、水疗和精品店集中在 Jalan Kayu Aya（Oberoi）和 Jalan Petitenget 一带。沙滩离多数酒店步行可达，17:00 起日落海滩酒吧陆续坐满。比长谷贵、也更挤，但打车和一日游方便得多。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-canggu"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-canggu-0.jpg" alt="Canggu is a beach area in South Bali, north of Seminyak and south of Tanah Lot.Cf: Wikitravel" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Flickr user: afternoon · CC BY 2.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">长谷</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">1 hotels · <!-- -->18 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">冲浪 · 咖啡</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">长谷由 Berawa、Batu Bolong、Echo Beach 几个海边村落组成，稻田小路、浪点和素食咖啡馆交织在一起。年轻人和长住客居多，夜生活（Old Man&#x27;s、Finns、Atlas）是全岛最热闹的。地图上看着近，但小路窄，4 公里傍晚要开 25 分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-ubud"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-ubud-0.jpg" alt="Rice terraces in Bali. Rice fields. Traditional rice farming in Bali. This is probably one of the most photographed in-land places in Bali. Tegallalang, Ubud. Bali, Indonesia." loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Vyacheslav Argenberg · CC BY 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">乌布</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">3 hotels · <!-- -->27 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">自然 · 文化</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">乌布在 Gianyar 高地，距机场 1 至 2 小时，是巴厘岛文化、瑜伽和自然线路的基地。皇宫、艺术市场和圣猴森林公园从镇中心步行可达，德格拉朗、Tegenungan、圣泉寺和阿漾河漂流段在 15 至 40 分钟车程内。没有海滩，除了少数酒吧和舞蹈演出，晚上很安静。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-uluwatu"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-uluwatu-0.jpg" alt="Luhur Temple, Uluwatu, Bali" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Jakub Hałun · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">乌鲁瓦图（武吉半岛）</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">6 hotels · <!-- -->15 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">悬崖 · 日落</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">武吉半岛是巴厘岛南部干燥的丘陵地带，70 米高的悬崖直落巴东巴东、宾金、梅拉斯蒂等白沙滩。乌鲁瓦图神庙和 Single Fin 悬崖酒吧撑起日落时段的客流，全岛大部分超豪华别墅也在这里。海滩之间要开车或骑摩托，沿海公路多是断头路。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-nusa-dua"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-nusa-dua-1.jpg" alt="View of Nusa Dua beach in Bali behind Grand Nikko hotel in the morning." loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Anton Ardyanto · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">努沙杜瓦</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">11 hotels · <!-- -->8 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">豪华度假村</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">努沙杜瓦是规划出来的度假区，集中了国际酒店、修剪整齐的海滨步道和受礁石保护的平静海面，适合游泳和划艇。南部最亲子、最不混乱的一片，巴厘岛主要会展中心也在这里。出了度假区大门街上就没什么生活气息，夜生活只有酒店酒吧。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-sanur"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-sanur-0.jpg" alt="This is a scenery situated in Sanur Beach, Bali, Indonesia. There are some fishing boats passing by in the shore. That day is a little cloudy, but sun was shining brightly." loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Danangtrihartanto · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">沙努尔</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">3 hotels · <!-- -->11 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">平静 · 离岛渡轮</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">沙努尔是巴厘岛东岸安静的矮层海滨小镇，5 公里长的铺装海滨步道适合散步和骑行。礁石挡浪，水面平静，适合带孩子，沙努尔港是去佩尼达岛和蓝梦岛快艇的主要出发点。除库塔外离机场最近的海滨度假区，约 30 至 55 分钟。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-jimbaran"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-jimbaran-1.jpg" alt="Sunset cocktails at Puri Bali hotel" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Jc8136 · CC BY-SA 3.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">金巴兰</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">2 hotels · <!-- -->9 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">海鲜 · 日落</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">金巴兰湾在机场南侧转弯，最有名的是黄昏时分在沙滩上用椰壳炭火烤鱼的那排海鲜大排档。海水平静可以游泳，海湾朝西，南北两端各有一批五星级度假村。离机场近，适合落地第一晚或离开前一晚。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-kuta-legian"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-kuta-legian-0.jpg" alt="Jerman Beach in Kuta, Bali, Indonesia" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Jakub Hałun · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">库塔 / 勒吉安</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">5 hotels · <!-- -->4 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">机场 · 冲浪课</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">库塔和旁边的勒吉安是巴厘岛最早的旅游区：一条缓坡冲浪海滩，背后是市场、青旅、酒吧和 Beachwalk 商场。短期停留最便宜也最方便，机场接送全岛最短。代价是堵车、拉客，以及 Jalan Legian 和 Sky Garden 一带的年轻派对人群。</p></div></button></article><article class="group overflow-hidden rounded-card border bg-surface transition-colors duration-150 border-line hover:border-line-strong" data-testid="area-card-amed"><button type="button" class="block w-full text-left"><figure class="relative overflow-hidden bg-paper-warm aspect-[3/2]"><img src="/images/bali/area-amed-1.jpg" alt="Amed Beach in February" loading="lazy" decoding="async" sizes="(max-width: 1023px) 100vw, 360px" class="h-full w-full object-cover"/><figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/55 to-transparent px-2.5 pb-1.5 pt-6"><span class="mt-0.5 block truncate text-[9.5px] leading-tight text-white/60">Ch cat · CC BY-SA 4.0</span></figcaption></figure><div class="px-4 pb-4 pt-3.5"><div class="flex items-baseline justify-between gap-3"><h3 class="text-[18px] font-semibold leading-tight tracking-[-0.018em] text-ink">艾湄</h3><span class="shrink-0 text-[11px] tabular-nums text-faint">4 个地点</span></div><p class="mt-1.5 text-[12.5px] font-medium leading-tight text-accent">潜水 · 安静海岸</p><p class="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-ink-soft">艾湄是巴厘岛东北岸一串渔村，沿黑色火山沙海岸展开，距机场约 2.5 至 3.5 小时。全岛最好的岸潜基地，图兰奔的 USAT Liberty 沉船和 Jemeluk 湾的珊瑚墙都在附近，清晨还能回望阿贡火山。住宿以小客栈和潜水度假村为主。</p></div></button></article></div><footer class="border-t border-line px-4 py-3"><p class="text-[11.5px] leading-relaxed text-muted">本行程助手收录了 15 个区域。区域范围是根据已收录内容推算的近似范围，不是官方行政区划。</p></footer></div></div></div></div></div></section></main><!--$--><!--/$--><script src="/_next/static/chunks/webpack-f951ec1a8bd314fd.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[9766,[],\"\"]\n3:I[8924,[],\"\"]\n5:I[4431,[],\"OutletBoundary\"]\n7:I[5278,[],\"AsyncMetadataOutlet\"]\n9:I[4431,[],\"ViewportBoundary\"]\nb:I[4431,[],\"MetadataBoundary\"]\nc:\"$Sreact.suspense\"\ne:I[7150,[],\"\"]\n:HL[\"/_next/static/css/f2b36fc23db75d41.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"5ACfA3pAbUiyp1WeoV-oy\
